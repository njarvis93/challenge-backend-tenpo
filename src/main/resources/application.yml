spring:
  application:
    name: challenge-backend-tenpo
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tenpo}
    username: ${DB_USER:tenpo}
    password: ${DB_PASSWORD:tenpo}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      pool-name: tenpo-hikari
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  webflux:
    problemdetails:
      # Desactivado a proposito: el manejador de Boot se adelanta al propio y
      # devuelve mensajes genericos ("Invalid request content."). GlobalExceptionHandler
      # emite RFC 7807 con el detalle de que campo fallo.
      enabled: false

server:
  port: ${SERVER_PORT:8080}

app:
  percentage:
    # Servicio externo de porcentaje. Por defecto apunta al mock que expone
    # esta misma aplicacion; en un entorno real seria una URL de terceros.
    url: ${PERCENTAGE_SERVICE_URL:http://localhost:8080/internal/mock/percentage}
    timeout: 2s
    max-attempts: 3
    initial-backoff: 200ms
  mock:
    enabled: ${MOCK_ENABLED:true}
    min-percentage: 5.0
    max-percentage: 20.0
    # 0.0 = nunca falla. Subir a 1.0 para ver los 3 reintentos y el 503.
    failure-rate: ${MOCK_FAILURE_RATE:0.0}
    # Semilla opcional para hacer reproducible el porcentaje aleatorio.
    seed: ${MOCK_SEED:}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    capacity: 3
    period: 1m
    key: rate-limit:global
    redis-url: ${REDIS_URL:redis://localhost:6379}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    cl.tenpo.challenge: INFO
