name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar y probar
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # Los tests de integracion levantan PostgreSQL con Testcontainers,
      # que usa el Docker ya disponible en el runner de GitHub.
      - name: Build y tests
        run: ./mvnw -B -ntp verify

      - name: Publicar reportes de test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
          retention-days: 7

      - name: Publicar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: challenge-backend-tenpo-jar
          path: target/*.jar
          retention-days: 7

  docker:
    name: Imagen Docker
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Solo se valida que el Dockerfile construya; no se publica la imagen.
      - name: Construir imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: challenge-backend-tenpo:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
