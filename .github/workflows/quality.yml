name: Calidad

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Cobertura, bugs y code smells
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # Las tres puertas de calidad viven en el pom y corren en la fase verify:
      #   - jacoco:check  -> falla si la cobertura de lineas baja del 80%
      #   - spotbugs:check-> falla ante bugs y vulnerabilidades en el bytecode
      #   - pmd:check     -> falla ante code smells; cpd-check, ante duplicacion
      # Ejecutarlas aqui no requiere ninguna cuenta ni servicio externo.
      - name: Analisis
        run: ./mvnw -B -ntp verify

      - name: Resumen de cobertura
        if: always()
        run: |
          report=target/site/jacoco/jacoco.csv
          [ -f "$report" ] || exit 0
          awk -F, 'NR>1 {miss+=$8; cov+=$9} END {
            printf "### Cobertura de lineas: %.1f%% (%d/%d)\n", 100*cov/(cov+miss), cov, cov+miss
          }' "$report" >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            target/site/jacoco/
            target/spotbugsXml.xml
            target/pmd.xml
            target/cpd.xml
          retention-days: 7
